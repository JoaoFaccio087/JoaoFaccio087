name: generate profile stats

on:
  schedule:
    # Atualiza a cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:        # permite rodar manualmente pela aba "Actions"
  push:
    branches:
      - main
    paths:
      - .github/workflows/stats.yml
      - .github/scripts/streak.mjs

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Se criar o secret STATS_TOKEN (PAT com read:user + repo), conta também os repos privados
      STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: stats (claro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_border=true&bg_color=00000000&locale=pt-br
          path: profile/stats.svg
          token: ${{ env.STATS_TOKEN }}

      - name: stats (escuro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_border=true&theme=github_dark&bg_color=00000000&locale=pt-br
          path: profile/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}

      - name: linguagens (claro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ env.STATS_TOKEN }}

      - name: linguagens (escuro)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=github_dark&bg_color=00000000&locale=pt-br
          path: profile/top-langs-dark.svg
          token: ${{ env.STATS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: streak
        run: node .github/scripts/streak.mjs "${{ github.repository_owner }}" profile
        env:
          GITHUB_TOKEN: ${{ env.STATS_TOKEN }}

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "Sem mudanças" && exit 0
          git commit -m "chore: atualiza cards do perfil"
          git push
